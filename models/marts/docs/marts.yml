version: 2

models:
  - name: dim_location
    description: >
      City dimension table.
      Grain: one row per city extracted from the Open-Meteo Geocoding API.
    columns:
      - name: location_id
        description: "Unique identifier from the Geocoding API."
        tests:
          - not_null
          - unique
      - name: location_sk
        description: "Surrogate key."
        tests:
          - not_null
          - unique
      - name: city_name
        description: "Name of the city."
        tests:
          - not_null
      - name: country
        description: "Country name."
      - name: country_code
        description: "ISO country code."
        tests:
          - not_null
      - name: admin1
        description: "First-level administrative region (autonomous community in Spain)."
      - name: latitude
        description: "Latitude in decimal degrees."
        tests:
          - not_null
      - name: longitude
        description: "Longitude in decimal degrees."
        tests:
          - not_null
      - name: timezone
        description: "IANA timezone string."
      - name: elevation
        description: "Elevation in metres above sea level."
      - name: population
        description: "City population."

  - name: fct_city_weather_day
    description: >
      Fact table for daily weather observations per city.
      Grain: one row per city per date.
      Includes risk flags and daily risk score derived from weather and air quality.
    columns:
      - name: city_day_weather_sk
        description: "Surrogate key (location_id + date)."
        tests:
          - not_null
          - unique
      - name: location_id
        description: "Foreign key to dim_location."
        tests:
          - not_null
          - relationships:
              to: ref('dim_location')
              field: location_id
      - name: weather_date
        description: "Calendar date of the observation."
        tests:
          - not_null
      - name: temperature_2m_max
        description: "Maximum daily temperature at 2m in °C."
      - name: temperature_2m_min
        description: "Minimum daily temperature at 2m in °C."
      - name: temperature_2m_mean
        description: "Mean daily temperature at 2m in °C."
      - name: precipitation_sum
        description: "Total daily precipitation in mm."
      - name: rain_sum
        description: "Total daily rain in mm."
      - name: snowfall_sum
        description: "Total daily snowfall in cm."
      - name: wind_speed_10m_max
        description: "Maximum daily wind speed at 10m in km/h."
      - name: temp_range_c
        description: "Diurnal temperature range (max - min) in °C."
      - name: avg_european_aqi
        description: "Daily average European Air Quality Index (joined from air quality data)."
      - name: max_european_aqi
        description: "Daily maximum European AQI."
      - name: avg_pm10
        description: "Daily average PM10 in µg/m³."
      - name: avg_pm2_5
        description: "Daily average PM2.5 in µg/m³."
      - name: is_hot_day
        description: "1 if temperature_2m_max >= 30°C, else 0."
        tests:
          - not_null
          - accepted_values:
              values: [0, 1]
      - name: is_rainy_day
        description: "1 if precipitation_sum >= 5mm, else 0."
        tests:
          - not_null
          - accepted_values:
              values: [0, 1]
      - name: is_windy_day
        description: "1 if wind_speed_10m_max >= 30 km/h, else 0."
        tests:
          - not_null
          - accepted_values:
              values: [0, 1]
      - name: is_poor_air_day
        description: "1 if avg_european_aqi >= 50, else 0."
        tests:
          - not_null
          - accepted_values:
              values: [0, 1]
      - name: is_comfortable_day
        description: >
          1 if temperature mean is 18–26°C, precipitation < 1mm,
          wind < 25 km/h, and AQI < 50. Else 0.
        tests:
          - not_null
          - accepted_values:
              values: [0, 1]
      - name: daily_risk_score
        description: "Sum of risk flags (0–4). Higher = more weather risk."
        tests:
          - not_null
          - accepted_values:
              values: [0, 1, 2, 3, 4]

  - name: fct_air_quality_city_day
    description: >
      Fact table for daily air quality per city.
      Grain: one row per city per date.
      Aggregated from hourly readings in stg_air_quality_hourly.
    columns:
      - name: air_quality_daily_sk
        description: "Surrogate key (location_id + date)."
        tests:
          - not_null
          - unique
      - name: location_id
        tests:
          - not_null
          - relationships:
              to: ref('dim_location')
              field: location_id
      - name: city_name
        tests:
          - not_null
      - name: air_quality_date
        tests:
          - not_null
      - name: avg_european_aqi
        description: "Daily average European AQI."
      - name: max_european_aqi
        description: "Daily maximum European AQI."
      - name: hourly_readings_count
        description: "Number of hourly readings used in the daily aggregation."

  - name: fct_forecast_city_day
    description: >
      Fact table for forecast data per city.
      Grain: one row per city per forecast date per extraction run.
    columns:
      - name: forecast_daily_sk
        description: "Surrogate key (location_id + forecast_date + extracted_at)."
        tests:
          - not_null
          - unique
      - name: location_id
        tests:
          - not_null
          - relationships:
              to: ref('dim_location')
              field: location_id
      - name: forecast_date
        description: "The date being forecasted."
        tests:
          - not_null
      - name: forecast_extracted_at
        description: "When this forecast snapshot was extracted."
        tests:
          - not_null

  - name: mart_city_weather_summary
    description: >
      Final denormalized mart for the Streamlit dashboard.
      Grain: one row per city per date.
      Joins fct_city_weather_day with dim_location. Includes all risk flags,
      air quality metrics, and comfort/risk scores.
      This is the primary table read by the dashboard.
    columns:
      - name: city_day_weather_sk
        description: "Surrogate key."
        tests:
          - not_null
          - unique
      - name: location_id
        tests:
          - not_null
      - name: city_name
        tests:
          - not_null
      - name: date_day
        description: "Calendar date. Grain key."
        tests:
          - not_null
      - name: daily_risk_score
        description: "Sum of risk flags (0–4)."
        tests:
          - not_null
          - accepted_values:
              values: [0, 1, 2, 3, 4]
      - name: is_comfortable_day
        tests:
          - accepted_values:
              values: [0, 1]
      - name: latitude
        tests:
          - not_null
      - name: longitude
        tests:
          - not_null
